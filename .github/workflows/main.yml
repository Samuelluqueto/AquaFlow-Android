name: Gerar APK AquaFlow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME"

      - name: Instalar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sincronizar arquivos Web
        run: |
          if [ -f "scripts/sync-web.sh" ]; then
            chmod +x scripts/sync-web.sh
            ./scripts/sync-web.sh
          else
            echo "Script de sincronização não encontrado."
          fi

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Verificar APK
        run: |
          echo "Procurando APK..."
          find . -name "*.apk" -type f -print

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaFlow-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
