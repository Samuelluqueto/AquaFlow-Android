name: Gerar APK AquaFlow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar arquivos do repositório
        run: |
          echo "=== ESTRUTURA DO REPOSITÓRIO ==="
          find . -maxdepth 5 -type f | sort

      - name: Localizar projeto Gradle
        run: |
          echo "Procurando settings.gradle..."

          PROJECT_FILE=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERRO: settings.gradle não encontrado!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Projeto encontrado em: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Mostrar projeto encontrado
        run: |
          echo "Pasta do projeto: $PROJECT_DIR"
          echo ""
          echo "Arquivos:"
          find "$PROJECT_DIR" -maxdepth 3 -type f | sort

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Sincronizar arquivos Web
        run: |
          if [ -f "$PROJECT_DIR/scripts/sync-web.sh" ]; then
            chmod +x "$PROJECT_DIR/scripts/sync-web.sh"
            "$PROJECT_DIR/scripts/sync-web.sh"
          else
            echo "Script sync-web.sh não encontrado."
            echo "Continuando..."
          fi

      - name: Gerar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Localizar APK
        run: |
          echo "=== PROCURANDO APK ==="

          find "$PROJECT_DIR" -name "*.apk" -type f -print

          mkdir -p apk-final

          APK=$(find "$PROJECT_DIR" -name "app-debug.apk" -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado!"
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" apk-final/AquaFlow.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaFlow-APK
          path: apk-final/AquaFlow.apk
          if-no-files-found: error
